/* ===== Stravelo upgrade: brand, motion, about ===== */
:root{--header-h:78px;--ease:cubic-bezier(.2,.7,.2,1);--rot:-1deg}
@media (max-width:959px){:root{--rot:0deg}}

/* Brand */
.brand{display:inline-flex;align-items:center;gap:10px;font-size:clamp(23px,2.3vw,28px);font-weight:900;letter-spacing:-.04em;line-height:1}
.brand:before{content:"";flex:0 0 auto;width:11px;height:11px;border-radius:3px;background:var(--accent);transform:rotate(45deg);animation:brandPulse 3.2s ease-in-out infinite}
.brand--footer{font-size:32px}
@keyframes brandPulse{0%,100%{box-shadow:0 0 0 0 rgba(200,46,52,.45)}50%{box-shadow:0 0 0 7px rgba(200,46,52,0)}}

/* Scroll progress + header */
#stravelo-progress{position:fixed;top:0;left:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--accent),#ff8a8f);z-index:200;pointer-events:none}
.site-header{transition:box-shadow .3s ease,background-color .3s ease}
.site-header.scrolled{box-shadow:0 8px 28px rgba(23,23,23,.1);background:#f7f5f2f7}
.desktop-nav a{position:relative}
.desktop-nav a:after{content:"";position:absolute;left:0;right:0;bottom:2px;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease)}
.desktop-nav a:hover:after{transform:scaleX(1)}

/* Buttons */
.btn{position:relative;overflow:hidden;transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .25s var(--ease),box-shadow .25s ease}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(200,46,52,.4)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent);transform:skewX(-20deg);transition:left .7s ease;pointer-events:none}
.btn-primary:hover:after{left:130%}
.btn-secondary:hover{transform:translateY(-2px)}

/* Hero: load-in + living background */
@keyframes riseIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes fadeScale{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
@keyframes gridPan{from{background-position:0 0,0 0}to{background-position:56px 56px,56px 56px}}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-40px,30px) scale(1.12)}}
@keyframes floatCard{0%,100%{transform:translateY(0) rotate(var(--rot))}50%{transform:translateY(-12px) rotate(var(--rot))}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{to{background-position:200% center}}
.hero{animation:gridPan 50s linear infinite}
.hero-glow{animation:drift 14s ease-in-out infinite alternate}
.hero-glow--small{animation-direction:alternate-reverse;animation-duration:18s}
.hero-grid{z-index:1}
.hero:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(480px circle at var(--mx,72%) var(--my,28%),rgba(255,90,95,.16),transparent 62%);transition:background .2s}
.hero .eyebrow{animation:riseIn .8s var(--ease) .05s backwards}
.hero-title__line:nth-child(1){animation:riseIn .9s var(--ease) .15s backwards}
.hero-title__line:nth-child(2){background:linear-gradient(90deg,#ff5a5f,#ffa08f,#ff5a5f,#ffa08f);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:riseIn .9s var(--ease) .3s backwards,shimmer 7s linear 1.4s infinite}
.hero-support{animation:riseIn .9s var(--ease) .45s backwards}
.hero .cta-row{animation:riseIn .9s var(--ease) .6s backwards}
.hero-line{animation:riseIn .9s var(--ease) .75s backwards}
.hero-visual{animation:fadeScale 1.1s var(--ease) .4s backwards}
.profile-card{position:relative;z-index:1;animation:floatCard 7s ease-in-out 1.5s infinite}
.hero-visual:before,.hero-visual:after{content:"";position:absolute;border-radius:50%;pointer-events:none;z-index:0}
.hero-visual:before{inset:-46px;border:1px dashed rgba(255,90,95,.38);background:radial-gradient(circle at 50% 0,#ff5a5f 0 5px,transparent 6px);animation:spin 38s linear infinite}
.hero-visual:after{inset:-96px;border:1px solid rgba(255,255,255,.07);background:radial-gradient(circle at 100% 50%,rgba(255,255,255,.7) 0 3px,transparent 4px);animation:spin 70s linear infinite reverse}
@media (max-width:959px){.hero-visual:after{display:none}.hero-visual:before{inset:-26px}}

/* Ticker */
.ticker{position:relative;overflow:hidden;background:#0b0b0c;border-block:1px solid var(--dark-border);padding-block:17px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.ticker__track{display:flex;width:max-content;animation:marquee 42s linear infinite}
.ticker:hover .ticker__track{animation-play-state:paused}
.ticker__item{display:inline-flex;align-items:center;gap:30px;padding-right:30px;font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--dark-muted);white-space:nowrap}
.ticker__item i{width:7px;height:7px;background:var(--accent);transform:rotate(45deg);display:inline-block}
@keyframes marquee{to{transform:translateX(-50%)}}

/* Scroll reveal (class added by script, so no-JS still shows everything) */
@keyframes revealUp{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
.js .rv{opacity:0}
.js .rv.in{opacity:1;animation:revealUp .9s var(--ease) var(--d,0s) backwards}

/* Cards, process, polish */
.card-index{transition:background-color .3s ease,color .3s ease,transform .3s var(--ease)}
.card:hover .card-index{background:var(--accent);color:#fff;transform:rotate(-6deg) scale(1.08)}
.process-step{transition:transform .3s var(--ease),border-color .3s ease}
.process-step:hover{transform:translateY(-4px);border-color:rgba(200,46,52,.5)}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(200,46,52,.55)}70%,100%{box-shadow:0 0 0 16px rgba(200,46,52,0)}}
.process-step__number{animation:ping 3s ease-out infinite}
.process-step:nth-child(2) .process-step__number{animation-delay:.5s}
.process-step:nth-child(3) .process-step__number{animation-delay:1s}
.process-step:nth-child(4) .process-step__number{animation-delay:1.5s}
.faq-item{transition:border-color .25s ease,box-shadow .25s ease}
.faq-item:hover,.faq-item[open]{border-color:rgba(200,46,52,.4);box-shadow:0 8px 24px rgba(23,23,23,.06)}
.principles__item{transition:transform .3s var(--ease)}
.principles__item:hover{transform:translateY(-3px)}
.fit-panel,.comparison-panel{transition:transform .3s var(--ease)}
.fit-panel:hover,.comparison-panel:hover{transform:translateY(-3px)}

/* Final CTA glow */
.final-cta:before{content:"";position:absolute;width:560px;height:560px;right:-140px;top:-180px;border-radius:50%;background:radial-gradient(circle,rgba(200,46,52,.42),transparent 65%);animation:drift 12s ease-in-out infinite alternate;pointer-events:none}
.final-cta__inner{position:relative;z-index:1}

/* About: bold brand-red section */
.about{position:relative;overflow:hidden;color:#fff;background:
  radial-gradient(circle at 85% 8%,rgba(255,255,255,.2),transparent 42%),
  radial-gradient(rgba(255,255,255,.09) 1px,transparent 1px) 0 0/26px 26px,
  linear-gradient(135deg,#d6363c 0%,#b02830 48%,#7d171d 100%)}
.about :focus-visible{outline-color:#fff}
.about-bg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.about-orb{position:absolute;border-radius:50%}
.about-orb--1{width:520px;height:520px;right:-160px;top:-180px;border:1px solid rgba(255,255,255,.22);animation:spin 60s linear infinite}
.about-orb--1:after{content:"";position:absolute;left:50%;top:-6px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#fff;box-shadow:0 0 18px 4px rgba(255,255,255,.6)}
.about-orb--2{width:320px;height:320px;left:-120px;bottom:-140px;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 68%);animation:drift 12s ease-in-out infinite alternate}
.about-orb--3{width:240px;height:240px;right:12%;bottom:-90px;border:1px dashed rgba(255,255,255,.25);animation:spin 45s linear infinite reverse}
.about-grid{position:relative;z-index:1;display:grid;gap:clamp(36px,6vw,84px);align-items:center}
@media (min-width:900px){.about-grid{grid-template-columns:.84fr 1.16fr}}

.about-card{background:#fff;color:var(--text-primary);border-radius:28px;padding:clamp(28px,3.6vw,42px);display:grid;justify-items:center;text-align:center;gap:4px;box-shadow:0 44px 90px rgba(55,0,5,.5),0 0 0 8px rgba(255,255,255,.14);min-width:0}
.about-avatar{position:relative;width:176px;height:176px;margin-bottom:var(--space-3)}
.about-avatar__ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(#c82e34,#ff9ea2,#fff0 62%,#c82e34);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 4px));animation:spin 7s linear infinite}
.about-avatar__photo{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);border-radius:50%;object-fit:cover;object-position:center 22%;display:block;box-shadow:0 10px 30px rgba(23,23,23,.25)}
.about-name{font-size:clamp(24px,2.6vw,30px);font-weight:900;letter-spacing:-.03em;line-height:1.1;color:var(--text-primary)}
.about-role{color:var(--accent);font-weight:800;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:var(--space-3)}
.about-links{display:grid;gap:10px;width:100%;padding-top:var(--space-3);border-top:1px solid var(--border);text-align:left}
.about-link{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:14px;text-decoration:none;color:var(--text-primary);transition:background-color .25s ease,transform .25s var(--ease)}
.about-link:hover{background:var(--accent-soft);transform:translateX(4px)}
.about-link__icon{flex:0 0 auto;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);transition:background-color .25s ease,color .25s ease}
.about-link:hover .about-link__icon{background:var(--accent);color:#fff}
.about-link__icon svg{width:19px;height:19px}
.about-link__text{display:grid;gap:1px;min-width:0}
.about-link__text small{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-secondary)}
.about-link__text b{font-size:15px;font-weight:700;overflow-wrap:anywhere}

.about-copy{display:grid;gap:var(--space-4);justify-items:start;min-width:0}
.about-copy .eyebrow{margin:0;color:#ffd3d5;display:inline-flex;align-items:center;gap:12px}
.about-copy .eyebrow:before{content:"";width:34px;height:2px;background:#fff;border-radius:2px}
.about-copy h2{font-size:clamp(27px,3.8vw,46px);font-weight:800;line-height:1.14;letter-spacing:-.03em;color:#fff;max-width:24ch}
.about-body{font-size:clamp(16px,1.7vw,19px);color:rgba(255,255,255,.9);max-width:58ch}
.about-chips{display:flex;flex-wrap:wrap;gap:10px}
.about-chips li{padding:9px 18px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.34);font-size:14px;font-weight:700;color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:background-color .25s ease,transform .25s var(--ease)}
.about-chips li:hover{background:rgba(255,255,255,.26);transform:translateY(-2px)}
.about .btn-primary{background:#fff;color:#a8232a}
.about .btn-primary:hover{background:#fff4f4;box-shadow:0 14px 34px rgba(60,0,6,.4)}
.about .btn-secondary{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
.about .btn-secondary:hover{background:rgba(255,255,255,.14);border-color:#fff}
.footer-contact a{overflow-wrap:anywhere}

/* Dialog motion */
@keyframes dialogIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes backdropIn{from{opacity:0}to{opacity:1}}
.dialog[open]{animation:dialogIn .4s var(--ease)}
.dialog[open]::backdrop{animation:backdropIn .3s ease}

/* Hero polish */
.hero-title{font-size:clamp(38px,5.4vw,78px);line-height:1.02}
.profile-card__row .tag{justify-self:start}


/* ===== Before / After section redesign ===== */
#comparison{position:relative;overflow:hidden;background:
  radial-gradient(circle at 88% 0%,rgba(200,46,52,.30),transparent 48%),
  radial-gradient(circle at 0% 100%,rgba(200,46,52,.16),transparent 46%),
  radial-gradient(rgba(255,255,255,.055) 1px,transparent 1px) 0 0/28px 28px,
  #0e0e10}
#comparison .section-heading h2{font-size:clamp(30px,4.8vw,58px);letter-spacing:-.035em}
#comparison .container{position:relative;z-index:1}

.comparison{position:relative;gap:30px;margin-bottom:30px;align-items:stretch}
.comparison-panel{position:relative;border-radius:var(--radius-lg);padding:clamp(26px,3.2vw,40px)}
.comparison-panel h3{font-size:clamp(21px,2.2vw,26px);letter-spacing:-.02em;margin-bottom:var(--space-3)}
.comparison-panel h3:before{display:block;font-size:11px;font-weight:800;letter-spacing:.18em;margin-bottom:10px}
.comparison-panel li{position:relative;padding:14px 0 14px 38px;font-size:16px}
.comparison-panel li:before{position:absolute;left:0;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;line-height:1}

/* Before: muted, "flat" */
.comparison-panel--feature{background:rgba(255,255,255,.03);border:1px dashed rgba(255,255,255,.16)}
.comparison-panel--feature h3:before{content:"BEFORE";color:var(--dark-muted)}
.comparison-panel--feature li{color:#9a9692}
.comparison-panel--feature li:before{content:"\2715";background:rgba(255,255,255,.07);color:#8d8985}

/* After: bright hero card */
.comparison-panel--ready{background:linear-gradient(180deg,#ffffff,#f6f2ec);border:none;box-shadow:0 30px 80px rgba(200,46,52,.28),0 0 0 1px rgba(200,46,52,.25);overflow:hidden}
.comparison-panel--ready:after{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,#c82e34,#ff7a7e,#c82e34);background-size:200% 100%;animation:shimmer 5s linear infinite}
.comparison-panel--ready h3:before{content:"AFTER";color:var(--accent)}
.comparison-panel--ready li{font-weight:600}
.comparison-panel--ready li:before{content:"\2713";background:var(--accent);color:#fff;box-shadow:0 4px 10px rgba(200,46,52,.35)}
@media (min-width:768px){.comparison-panel--ready{transform:translateY(-10px)}.comparison-panel--ready:hover{transform:translateY(-14px)}}

/* Arrow between the two panels */
@media (min-width:768px){
  .comparison:after{content:"\2192";position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:700;z-index:3;box-shadow:0 0 0 8px rgba(200,46,52,.2),0 12px 30px rgba(200,46,52,.45);animation:ping 3s ease-out infinite}
}

/* Rewrite card */
.rewrite{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.12);border-radius:var(--radius-lg);padding:clamp(18px,2.6vw,30px);gap:24px}
.rewrite:before{content:"";position:absolute;right:-80px;top:-120px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(200,46,52,.28),transparent 65%);pointer-events:none}
.rewrite__side{position:relative;border-radius:var(--radius-md);padding:clamp(18px,2.4vw,26px);align-content:start;gap:14px}
.rewrite__side .tag{justify-self:start;align-self:start}
.rewrite blockquote{margin:0}
.rewrite__side--before{background:rgba(255,255,255,.03);border:1px dashed rgba(255,255,255,.16)}
.rewrite__side--before blockquote{font-size:clamp(17px,1.8vw,20px);line-height:1.5;color:#8f8b87}
.rewrite__side--after{background:linear-gradient(160deg,rgba(200,46,52,.22),rgba(200,46,52,.08));border:1px solid rgba(255,90,95,.55);box-shadow:0 0 40px rgba(200,46,52,.22)}
.rewrite__side--after blockquote{font-size:clamp(19px,2.1vw,24px);line-height:1.42;font-weight:650;color:#fff}
.rewrite__side--after:before{content:"\2192";position:absolute;left:-36px;top:50%;margin-top:-20px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:700;z-index:2;box-shadow:0 0 0 5px #17171a}
.rewrite__note{position:relative;font-size:13px;letter-spacing:.02em}
@media (max-width:767px){
  .rewrite__side--after:before{content:"\2193";left:50%;top:-34px;margin:0 0 0 -20px}
}


/* Keep brand on one line on small phones */
.brand{white-space:nowrap}
@media (max-width:480px){
  .brand{font-size:21px;gap:8px}
  .brand:before{width:9px;height:9px}
  .header-actions{gap:8px}
  .header-cta{padding:8px 14px;min-height:40px;font-size:14px}
}

.final-cta__support{max-width:52ch;font-size:clamp(17px,1.8vw,20px)}
.final-cta__mark{position:absolute;right:-24px;bottom:-30px;z-index:0;opacity:.07;color:#fff;pointer-events:none}
.final-cta__mark .rl{height:auto;width:clamp(300px,70vw,1000px)}
.final-cta__mark .rl-a,.final-cta__mark .rl-dot{fill:#fff;animation:none}
.final-cta__mark .rl-badge{fill:none;stroke:#fff;stroke-width:2.5}
.final-cta__mark .rl-route{stroke:#fff}

/* contact dialog */
.contact-dialog{border:0;border-radius:28px;padding:0;overflow:hidden;box-shadow:0 50px 120px rgba(0,0,0,.5)}
.contact-dialog::backdrop{background:rgba(14,12,13,.64);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.contact-dialog .dialog-inner{position:relative;padding:clamp(28px,4vw,42px)}
.contact-dialog .dialog-inner:before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,#c82e34,#ff7a7e,#c82e34);background-size:200% 100%;animation:shimmer 5s linear infinite}
.contact-dialog .dialog-header h2{font-size:clamp(24px,3vw,31px);font-weight:900;letter-spacing:-.03em}
.contact-dialog .field>span{font-weight:700;font-size:14px}
.contact-dialog .field input,.contact-dialog .field textarea{border-radius:14px;border:1.5px solid var(--border);padding:14px 16px;background:#fbfaf8;transition:border-color .2s ease,box-shadow .2s ease,background-color .2s ease}
.contact-dialog .field input:focus,.contact-dialog .field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(200,46,52,.15);background:#fff}
.contact-dialog .icon-button{transition:transform .3s var(--ease),background-color .2s ease}
.contact-dialog .icon-button:hover{transform:rotate(90deg)}
.notice--success{display:flex;align-items:center;gap:14px;font-size:18px;font-weight:700;padding:20px 22px;border-radius:18px}
.notice--success:before{content:"\2713";flex:0 0 42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-weight:800}
</style>
  
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style id="stravelo-polish">
/* Premium polish layer: typography, depth, and interaction refinements */
:root{
  --font-sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --background:#f6f4f0;
  --text-secondary:#5c5c5f;
  --border:#e4ded6;
  --shadow-soft:0 1px 2px rgba(17,17,18,.04),0 12px 32px rgba(17,17,18,.06);
  --shadow-lift:0 2px 4px rgba(17,17,18,.04),0 24px 48px rgba(17,17,18,.10);
}
body{font-feature-settings:"ss01","cv11";letter-spacing:-.005em;text-rendering:optimizeLegibility}
h1,h2,h3{font-weight:800;letter-spacing:-.035em;line-height:1.05}
h1{letter-spacing:-.045em}
p{text-wrap:pretty}
::selection{background:var(--accent);color:#fff}

/* Header: refined glass bar */
.site-header{background:rgba(246,244,240,.78)!important;-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid rgba(17,17,18,.06)}

/* Navigation links: quiet underline on hover */
.desktop-nav a{position:relative;text-decoration:none;font-weight:500;font-size:15px;letter-spacing:-.005em}
.desktop-nav a:after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:1.5px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease,cubic-bezier(.2,.7,.2,1))}
.desktop-nav a:hover:after{transform:scaleX(1)}

/* Buttons: confident, tactile */
.btn{letter-spacing:-.01em;transition:transform .25s ease,box-shadow .25s ease,background-color .2s ease,border-color .2s ease,color .2s ease}
.btn-primary{box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 8px 20px rgba(200,46,52,.22)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 14px 28px rgba(200,46,52,.28)}
.btn-primary:active,.btn-secondary:active{transform:translateY(0)}
.btn-secondary{box-shadow:var(--shadow-soft)}
.btn-secondary:hover{transform:translateY(-1px);box-shadow:var(--shadow-lift)}

/* Eyebrow labels: refined tracking */
.eyebrow{letter-spacing:.14em;font-weight:600;font-size:12px}

/* Cards and panels: subtle depth with gentle lift on hover */
[class*="card"],[class*="panel"],[class*="step"],[class*="principle"],[class*="service"]{transition:transform .4s var(--ease,cubic-bezier(.2,.7,.2,1)),box-shadow .4s ease,border-color .4s ease}
[class*="card"]:hover,[class*="principle"]:hover,[class*="service"]:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}

/* Motion respects user preferences */
@media (prefers-reduced-motion:reduce){*{transition:none!important;transform:none!important}}
</style>
</head>
